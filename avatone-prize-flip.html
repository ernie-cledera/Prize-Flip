<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avatone Prize Flip</title>
<style>
:root{--bg:#f6f3ff;--fg:#1d1633;--muted:#6b6485;--card:#7c4dff;--card2:#5b2fe0;--blank:#ffffff;--blankfg:#a59fbd;--gold:#ffb300;--silver:#22c55e;--border:#ddd5f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#150f26;--fg:#f3efff;--muted:#a79fc4;--blank:#241a40;--blankfg:#6f6890;--border:#3a2d63}}
:root[data-theme="dark"]{--bg:#150f26;--fg:#f3efff;--muted:#a79fc4;--blank:#241a40;--blankfg:#6f6890;--border:#3a2d63}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
main{width:100%;max-width:920px;padding:20px 14px 32px;text-align:center}
.logo{display:block;margin:0 auto 10px;width:clamp(150px,34vw,260px);height:auto}
h1{margin:0;font-size:clamp(26px,6vw,38px);letter-spacing:1px}
.sub{color:var(--muted);margin:6px 0 14px;font-size:14px}
.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:13px}
.pill{padding:6px 12px;border-radius:999px;border:1px solid var(--border);background:var(--blank)}
.pill b{font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:clamp(3px,.9vw,8px)}
.cell{aspect-ratio:3/4;perspective:600px;cursor:pointer;border:0;padding:0;background:none;font:inherit}
.inner{position:relative;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.cell.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.front{background:linear-gradient(145deg,var(--card),var(--card2));color:#fff;font-size:clamp(10px,2.6vw,22px);font-weight:700;box-shadow:0 3px 8px rgba(91,47,224,.35)}
.cell:hover:not(.flipped) .front{filter:brightness(1.12)}
.back{transform:rotateY(180deg);background:var(--blank);color:var(--blankfg);border:1px solid var(--border);font-size:clamp(7px,1.6vw,12px);font-weight:600;text-align:center;line-height:1.1}
.back small{font-size:clamp(5px,1.1vw,9px);font-weight:600;text-transform:uppercase}
.back.w100{background:var(--silver);color:#fff;border-color:var(--silver)}
.back.w500{background:linear-gradient(145deg,#ffd54f,var(--gold));color:#3b2a00;border-color:var(--gold);animation:glow 1.2s infinite alternate}
.back .big{font-size:clamp(9px,2.4vw,18px);font-weight:800}
.cell.auto .back{opacity:.55}
.cell.auto .back.w100,.cell.auto .back.w500{opacity:.9}
@keyframes glow{to{box-shadow:0 0 16px 3px rgba(255,179,0,.8)}}
.actions{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
button.btn{font:inherit;font-weight:700;padding:12px 22px;border-radius:12px;border:0;cursor:pointer;background:var(--card);color:#fff}
button.btn.alt{background:transparent;color:var(--fg);border:1px solid var(--border)}
button.btn:disabled{opacity:.45;cursor:default}
#msg{min-height:24px;margin-top:14px;font-weight:600}
@media (prefers-reduced-motion:reduce){.inner{transition:none}.back.w500{animation:none}}
</style>
</head>

  <h1>🎁 PRIZE FLIP 🎁</h1>
  <p class="sub">Avatone &middot; 50 cards, 6 winners. Pick a card and flip it!</p>
  <div class="stats">
    <span class="pill">💎 500 Aether left: <b id="s500">1</b></span>
    <span class="pill">✨ 100 Aether left: <b id="s100">5</b></span>
    <span class="pill">Flipped: <b id="sf">0</b>/50</span>
  </div>
  <div class="grid" id="grid"></div>
  <div id="msg" aria-live="polite"></div>
  <div class="actions">
    <button class="btn" id="revealAll">Reveal All</button>
    <button class="btn alt" id="reset">New Game</button>
  </div>
</main>
<script>
(function(){
  var grid=document.getElementById('grid'),msg=document.getElementById('msg');
  var cells=[],prizes=[],found=0;

  function rand(n){
    if(window.crypto&&crypto.getRandomValues){var a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
    return Math.floor(Math.random()*n);
  }
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rand(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}

  function build(){
    grid.innerHTML='';cells=[];found=0;msg.textContent='';
    prizes=[500,100,100,100,100,100];
    while(prizes.length<50)prizes.push(0);
    shuffle(prizes);
    prizes.forEach(function(p,i){
      var c=document.createElement('button');
      c.className='cell';c.type='button';c.setAttribute('aria-label','Card '+(i+1));
      var cls=p===500?'w500':p===100?'w100':'';
      var label=p?'<span class="big">'+p+'</span><small>Aether</small>':'<span>Try</span><small>again</small>';
      c.innerHTML='<div class="inner"><div class="face front">'+(i+1)+'</div><div class="face back '+cls+'">'+label+'</div></div>';
      c.addEventListener('click',function(){flip(i,false)});
      grid.appendChild(c);cells.push(c);
    });
    stats();
  }

  function flip(i,auto){
    var c=cells[i];
    if(c.classList.contains('flipped'))return;
    c.classList.add('flipped');
    if(auto)c.classList.add('auto');
    else{
      var p=prizes[i];
      msg.textContent=p===500?'🎉 JACKPOT! You won 500 Aether!':p===100?'🎉 You won 100 Aether!':'No prize this time. Try another card!';
    }
    stats();
  }

  function stats(){
    var f=0,w5=0,w1=0;
    cells.forEach(function(c,i){
      if(c.classList.contains('flipped')){f++;if(prizes[i]===500)w5++;else if(prizes[i]===100)w1++}
    });
    document.getElementById('sf').textContent=f;
    document.getElementById('s500').textContent=1-w5;
    document.getElementById('s100').textContent=5-w1;
    document.getElementById('revealAll').disabled=f===50;
  }

  document.getElementById('revealAll').addEventListener('click',function(){
    cells.forEach(function(c,i){setTimeout(function(){flip(i,true)},i*25)});
    msg.textContent='All cards revealed!';
  });
  document.getElementById('reset').addEventListener('click',build);
  build();
})();
</script>
